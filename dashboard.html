<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberShop — Dashboard</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .dashboard-saudacao-topo {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .dashboard-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #333;
      color: #fff;
      font-size: 1.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    .dashboard-avatar-img {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      object-fit: cover;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-titulo">Dashboard</h1>
      </div>
      <div class="page-body">

        <div class="dashboard-saudacao">
          <div class="dashboard-saudacao-topo">
            <div id="dashboard-avatar-container"></div>
            <div>
              <h2 id="saudacao-nome">Olá!</h2>
              <p class="texto-destaque">Bem vindo ao seu painel de reservas!</p>
            </div>
          </div>
        </div>

        <div class="dashboard-cards" id="dashboard-cards">
          <div class="loading-container" style="grid-column:1/-1;">
            <span class="loading-spinner dark"></span> Carregando...
          </div>
        </div>

        <div class="dashboard-cta">
          <a href="agendarhorario.html" class="btn-primary">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="4" width="18" height="18" rx="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
            </svg>
            Agendar um horário
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="5" y1="12" x2="19" y2="12"/>
              <polyline points="12 5 19 12 12 19"/>
            </svg>
          </a>
        </div>

      </div>
    </main>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    const usuario = protegerRota();
    renderizarSidebar('dashboard');

    const primeiroNome = usuario.nome.split(' ')[0];
    document.getElementById('saudacao-nome').textContent = 'Olá, ' + primeiroNome + '!';

    (function montarAvatar() {
      const container = document.getElementById('dashboard-avatar-container');
      const fotoSalva = localStorage.getItem('perfil_foto_' + usuario.id);
      if (fotoSalva) {
        const img = document.createElement('img');
        img.src = fotoSalva;
        img.className = 'dashboard-avatar-img';
        img.alt = 'Foto de perfil';
        container.appendChild(img);
      } else {
        const div = document.createElement('div');
        div.className = 'dashboard-avatar';
        div.textContent = primeiroNome.charAt(0).toUpperCase();
        container.appendChild(div);
      }
    })();

    async function carregarDashboard() {
      try {
        const dadosUsuario = await apiGet('usuarios/' + usuario.id);
        const reservas = await apiGet('reservas?usuario_id=' + usuario.id);

        const fotoFinal = dadosUsuario.foto || localStorage.getItem('perfil_foto_' + usuario.id);
        if (fotoFinal) {
          const container = document.getElementById('dashboard-avatar-container');
          container.innerHTML = '';
          const img = document.createElement('img');
          img.src = fotoFinal;
          img.className = 'dashboard-avatar-img';
          img.alt = 'Foto de perfil';
          container.appendChild(img);
        }

        const hoje = new Date().toISOString().split('T')[0];
        const futuras = reservas.filter(function(r) {
          return r.data >= hoje && r.status === 'confirmado';
        }).sort(function(a, b) { return a.data.localeCompare(b.data); });

        const proxima = futuras[0];

        let proximaHtml;
        if (proxima) {
          const dataFormatada = proxima.data.split('-').reverse().join('/');
          proximaHtml =
            '<div class="card-valor" style="font-size:1rem;">' + proxima.diaSemana + ', ' + dataFormatada + '</div>' +
            '<div class="card-info">' + proxima.servico + ' com ' + proxima.barbeiro_nome + ' às ' + proxima.hora + '</div>';
        } else {
          proximaHtml =
            '<div class="card-valor" style="font-size:0.9rem; font-weight:400; color:var(--cor-texto-suave);">Nenhuma reserva agendada</div>' +
            '<div class="card-info"><a href="agendarhorario.html" class="texto-destaque">Agendar agora →</a></div>';
        }

        const totalVisitas = (dadosUsuario.cortesRealizados || 0) + (dadosUsuario.barbasFeitas || 0);

        document.getElementById('dashboard-cards').innerHTML =
          '<div class="dashboard-card-resumo">' +
            '<div class="card-label">Próxima Reserva</div>' +
            proximaHtml +
          '</div>' +
          '<div class="dashboard-card-resumo">' +
            '<div class="card-label">Total de Visitas</div>' +
            '<div class="card-valor">' + totalVisitas + '</div>' +
            '<div class="card-info">' + (dadosUsuario.cortesRealizados || 0) + ' corte(s) · ' + (dadosUsuario.barbasFeitas || 0) + ' barba(s)</div>' +
          '</div>';

      } catch (err) {
        document.getElementById('dashboard-cards').innerHTML =
          '<div class="alert alert-error" style="grid-column:1/-1;">Erro ao carregar dados. Tente novamente.</div>';
      }
    }

    carregarDashboard();
  </script>

</body>
</html>
