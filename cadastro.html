<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberShop — Cadastro</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-container">

    <div class="auth-logo-texto">✂ BarberShop</div>

    <h1 class="auth-titulo" style="font-size:1.3rem; margin-bottom:20px;">Criar Conta</h1>

    <div id="alerta-cadastro" class="auth-alert hidden"></div>

    <form class="auth-form cadastro-form" id="form-cadastro" novalidate>

      <div class="input-group">
        <label for="nome">Nome Completo</label>
        <div class="input-wrapper">
          <input type="text" id="nome" class="input-field" placeholder="Seu nome completo" autocomplete="name">
        </div>
        <span class="mensagem-erro-campo" id="nome-erro"></span>
      </div>

      <div class="input-group">
        <label for="telefone">Telefone</label>
        <div class="input-wrapper">
          <input type="tel" id="telefone" class="input-field" placeholder="(XX) XXXXX-XXXX" autocomplete="tel">
        </div>
        <span class="mensagem-erro-campo" id="telefone-erro"></span>
      </div>

      <div class="input-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <input type="email" id="email" class="input-field" placeholder="seu@email.com" autocomplete="email">
        </div>
        <span class="mensagem-erro-campo" id="email-erro"></span>
      </div>

      <div class="input-group">
        <label for="senha">Senha</label>
        <div class="input-wrapper">
          <input type="password" id="senha" class="input-field" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
          <button type="button" class="toggle-senha" id="btn-toggle-senha" onclick="toggleSenha('senha','btn-toggle-senha')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <div class="forca-senha">
          <div class="forca-senha-barra"><div class="forca-senha-fill" id="forca-barra"></div></div>
          <span class="forca-senha-texto" id="forca-texto"></span>
        </div>
        <span class="mensagem-erro-campo" id="senha-erro"></span>
      </div>

      <div class="input-group">
        <label for="confirmar-senha">Confirmar Senha</label>
        <div class="input-wrapper">
          <input type="password" id="confirmar-senha" class="input-field" placeholder="Repita a senha" autocomplete="new-password">
          <button type="button" class="toggle-senha" id="btn-toggle-confirmar" onclick="toggleSenha('confirmar-senha','btn-toggle-confirmar')">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
        <span class="mensagem-erro-campo" id="confirmar-senha-erro"></span>
      </div>

      <label class="checkbox-grupo">
        <input type="checkbox" id="termos">
        Li e aceito os <a href="#" onclick="return false;">termos de uso</a>
      </label>
      <span class="mensagem-erro-campo" id="termos-erro"></span>

      <div class="auth-acoes">
        <button type="submit" class="btn-primary" id="btn-cadastrar" style="max-width:100%;">CADASTRAR</button>
      </div>

    </form>

    <p class="auth-rodape">
      Já tem conta? <a href="index.html">Entrar</a>
    </p>

  </div>

  <script src="js/api.js">
</script>
  <script src="js/auth.js">
</script>
  <script>    aplicarMascaraTelefone(document.getElementById('telefone'));
    atualizarForcaSenha('senha', 'forca-barra', 'forca-texto');
    document.getElementById('form-cadastro').addEventListener('submit', async function(e) {
      e.preventDefault();
      const nome = document.getElementById('nome').value.trim();
      const telefone = document.getElementById('telefone').value.trim();
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      const confirmar = document.getElementById('confirmar-senha').value;
      const termos = document.getElementById('termos').checked;
      let valido = true;
      ['nome','telefone','email','senha','confirmar-senha'].forEach(limparErro);
      limparAlerta('alerta-cadastro');
      if (!nome) { marcarErro('nome', 'Campo obrigatório'); valido = false; }
      if (!telefone || telefone.replace(/\D/g,'').length < 10) { marcarErro('telefone', 'Telefone inválido'); valido = false; }
      if (!email) { marcarErro('email', 'Campo obrigatório'); valido = false; }
      else if (!validarEmail(email)) { marcarErro('email', 'Email inválido'); valido = false; }
      if (!senha || senha.length < 6) { marcarErro('senha', 'Mínimo 6 caracteres'); valido = false; }
      if (!confirmar) { marcarErro('confirmar-senha', 'Campo obrigatório'); valido = false; }
      else if (senha !== confirmar) { marcarErro('confirmar-senha', 'As senhas não coincidem'); valido = false; }
      if (!termos) { document.getElementById('termos-erro').textContent = 'Aceite os termos para continuar'; valido = false; }
      else { document.getElementById('termos-erro').textContent = ''; }
      if (!valido) return;
      const btn = document.getElementById('btn-cadastrar');
      mostrarBtnLoading(btn);
      try {
        const existentes = await apiGet(`usuarios?email=${encodeURIComponent(email)}`);
        if (existentes.length > 0) {
          mostrarAlerta('alerta-cadastro', 'Este email já está cadastrado.', 'error');
          esconderBtnLoading(btn);
          return;
        }
        const novoUsuario = {
          nome,
          email,
          senha,
          telefone,
          plano: 'gratis',
          membroDesde: String(new Date().getFullYear()),
          cortesRealizados: 0,
          barbasFeitas: 0,
          foto: null
        };
        const criado = await apiPost('usuarios', novoUsuario);
        salvarSessao(criado);
        window.location.href = 'dashboard.html';
      } catch (err) {
        mostrarAlerta('alerta-cadastro', 'Erro ao cadastrar. Tente novamente.', 'error');
        esconderBtnLoading(btn);
      }
    });
</script>

</body>
</html>
