<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberShop — Nova Senha</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body class="auth-body">

  <div class="auth-container">

    <div class="auth-logo-texto">✂ BarberShop</div>

    <div id="tela-form" class="nova-senha-form">
      <h1 class="nova-senha-titulo">Criar Nova Senha</h1>
      <p class="nova-senha-subtitulo">Escolha uma senha segura para sua conta</p>

      <div id="alerta-nova-senha" class="auth-alert hidden"></div>

      <form class="auth-form" id="form-nova-senha" novalidate>

        <div class="input-group">
          <label for="nova-senha">Nova Senha</label>
          <div class="input-wrapper">
            <input type="password" id="nova-senha" class="input-field" placeholder="Mínimo 6 caracteres" autocomplete="new-password">
            <button type="button" class="toggle-senha" id="btn-nova-toggle" onclick="toggleSenha('nova-senha','btn-nova-toggle')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="forca-senha">
            <div class="forca-senha-barra"><div class="forca-senha-fill" id="forca-barra"></div></div>
            <span class="forca-senha-texto" id="forca-texto"></span>
          </div>
          <span class="mensagem-erro-campo" id="nova-senha-erro"></span>
        </div>

        <div class="input-group">
          <label for="confirmar-nova-senha">Confirmar Senha</label>
          <div class="input-wrapper">
            <input type="password" id="confirmar-nova-senha" class="input-field" placeholder="Repita a nova senha" autocomplete="new-password">
            <button type="button" class="toggle-senha" id="btn-confirmar-toggle" onclick="toggleSenha('confirmar-nova-senha','btn-confirmar-toggle')">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <span class="mensagem-erro-campo" id="confirmar-nova-senha-erro"></span>
        </div>

        <div class="auth-acoes">
          <button type="submit" class="btn-primary" id="btn-alterar" style="max-width:100%;">Salvar Nova Senha</button>
        </div>

      </form>
    </div>

    <div id="tela-sucesso" class="sucesso-container hidden">
      <div class="icone-sucesso">
        <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3">
          <polyline points="20 6 9 12 4 10"></polyline>
        </svg>
      </div>
      <h2 class="sucesso-titulo">Senha alterada com sucesso!</h2>
      <p class="sucesso-subtitulo">Sua senha foi atualizada. Redirecionando para o login...</p>
      <p class="contador-redirect" id="contador-redirect"></p>
      <div class="auth-acoes" style="margin-top:16px;">
        <a href="index.html" class="btn-primary">Fazer Login</a>
      </div>
    </div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script>
    atualizarForcaSenha('nova-senha', 'forca-barra', 'forca-texto');

    document.getElementById('confirmar-nova-senha').addEventListener('input', function() {
      const nova = document.getElementById('nova-senha').value;
      if (this.value && this.value !== nova) {
        marcarErro('confirmar-nova-senha', 'As senhas não coincidem');
      } else {
        limparErro('confirmar-nova-senha');
      }
    });

    document.getElementById('form-nova-senha').addEventListener('submit', async function(e) {
      e.preventDefault();

      const nova = document.getElementById('nova-senha').value;
      const confirmar = document.getElementById('confirmar-nova-senha').value;
      let valido = true;

      limparErro('nova-senha');
      limparErro('confirmar-nova-senha');
      limparAlerta('alerta-nova-senha');

      if (!nova || nova.length < 6) { marcarErro('nova-senha', 'Mínimo 6 caracteres'); valido = false; }
      if (!confirmar) { marcarErro('confirmar-nova-senha', 'Campo obrigatório'); valido = false; }
      else if (nova !== confirmar) { marcarErro('confirmar-nova-senha', 'As senhas não coincidem'); valido = false; }

      if (!valido) return;

      const emailRecuperar = sessionStorage.getItem('recuperar_email');
      if (!emailRecuperar) {
        mostrarAlerta('alerta-nova-senha', 'Sessão expirada. Inicie o processo novamente.', 'error');
        return;
      }

      const btn = document.getElementById('btn-alterar');
      mostrarBtnLoading(btn);

      try {
        const usuarios = await apiGet(`usuarios?email=${encodeURIComponent(emailRecuperar)}`);
        if (usuarios.length === 0) throw new Error('Usuário não encontrado');

        await apiPatch(`usuarios/${usuarios[0].id}`, { senha: nova });

        const idCodigo = sessionStorage.getItem('codigo_id');
        if (idCodigo) {
          try { await apiDelete(`codigos_verificacao/${idCodigo}`); } catch (_) {}
        }

        sessionStorage.removeItem('recuperar_email');
        sessionStorage.removeItem('codigo_id');

        document.getElementById('tela-form').classList.add('hidden');
        document.getElementById('tela-sucesso').classList.remove('hidden');

        let conta = 4;
        const el = document.getElementById('contador-redirect');
        const intervalo = setInterval(function() {
          conta--;
          el.textContent = `Redirecionando em ${conta}...`;
          if (conta <= 0) {
            clearInterval(intervalo);
            window.location.href = 'index.html';
          }
        }, 1000);
        el.textContent = `Redirecionando em ${conta}...`;

      } catch (err) {
        mostrarAlerta('alerta-nova-senha', 'Erro ao alterar senha. Tente novamente.', 'error');
        esconderBtnLoading(btn);
      }
    });
  </script>

</body>
</html>
