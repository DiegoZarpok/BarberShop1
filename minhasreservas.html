<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BarberShop — Minhas Reservas</title>
  <link rel="stylesheet" href="css/global.css">
  <link rel="stylesheet" href="css/app.css">
  <style>
    .reserva-acoes { display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
    .btn-editar { background:#fff; border:1px solid #ccc; color:var(--cor-texto); padding:6px 14px; border-radius:6px; font-size:0.82rem; cursor:pointer; font-weight:500; transition:background 0.2s; }
    .btn-editar:hover { background:#f0f0f0; }
    .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.45); display:flex; align-items:center; justify-content:center; z-index:999; }
    .modal-caixa { background:#fff; border-radius:12px; padding:28px 24px; max-width:420px; width:90%; box-shadow:0 8px 32px rgba(0,0,0,0.18); }
    .modal-titulo { font-size:1.1rem; font-weight:700; margin-bottom:10px; }
    .modal-texto { color:var(--cor-texto-suave); font-size:0.92rem; margin-bottom:20px; }
    .modal-acoes { display:flex; gap:10px; justify-content:flex-end; }
    .pill-opcao { padding:6px 14px; border-radius:20px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:0.85rem; margin:4px; }
    .pill-opcao.disponivel:hover { background:var(--cor-primaria); color:#fff; border-color:var(--cor-primaria); }
    .pill-opcao.indisponivel { opacity:0.4; cursor:not-allowed; background:#f5f5f5; }
    .pill-opcao.selecionado { background:var(--cor-primaria); color:#fff; border-color:var(--cor-primaria); }
    .horarios-grid { display:flex; flex-wrap:wrap; gap:4px; margin-top:12px; }
    .modal-secao { margin-bottom:14px; }
    .modal-secao label { font-size:0.88rem; font-weight:600; display:block; margin-bottom:6px; }
  </style>
</head>
<body>

  <div class="app-layout">
    <aside class="sidebar" id="sidebar"></aside>

    <main class="main-content">
      <div class="page-header">
        <h1 class="page-titulo">Minhas Reservas</h1>
      </div>
      <div class="page-body">
        <div id="reservas-conteudo">
          <div class="loading-container">
            <span class="loading-spinner dark"></span> Carregando reservas...
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Modal Cancelar -->
  <div class="modal-overlay hidden" id="modal-cancelar">
    <div class="modal-caixa">
      <h3 class="modal-titulo">Cancelar Reserva</h3>
      <p class="modal-texto">Tem certeza que deseja cancelar esta reserva? Esta ação não pode ser desfeita.</p>
      <div class="modal-acoes">
        <button class="btn-secondary" onclick="fecharModalCancelar()">Não, manter</button>
        <button class="btn-danger" id="btn-confirmar-cancelar">Sim, cancelar</button>
      </div>
    </div>
  </div>

  <!-- Modal Editar -->
  <div class="modal-overlay hidden" id="modal-editar">
    <div class="modal-caixa" style="max-width:480px;">
      <h3 class="modal-titulo">Editar Reserva</h3>
      <p class="modal-texto">Escolha uma nova data e horário para sua reserva.</p>

      <div class="modal-secao">
        <label>Nova Data:</label>
        <input type="date" id="edit-data" class="input-field" style="width:100%;">
      </div>

      <div class="modal-secao">
        <label>Horários disponíveis:</label>
        <div class="horarios-grid" id="edit-horarios-grid">
          <span style="color:var(--cor-texto-suave); font-size:0.85rem;">Selecione uma data primeiro</span>
        </div>
        <span class="mensagem-erro-campo" id="edit-horario-erro"></span>
      </div>

      <div id="edit-alerta" class="hidden" style="margin-bottom:10px;"></div>

      <div class="modal-acoes">
        <button class="btn-secondary" onclick="fecharModalEditar()">Cancelar</button>
        <button class="btn-primary" id="btn-confirmar-editar">Salvar alteração</button>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/sidebar.js"></script>
  <script>
    const usuario = protegerRota();
    renderizarSidebar('reservas');

    let reservaParaCancelar = null;
    let reservaParaEditar = null;
    let novoHorarioSelecionado = null;

    function formatarData(dataISO) {
      const partes = dataISO.split('-');
      return partes[2] + '/' + partes[1] + '/' + partes[0];
    }

    // ---- Modal Cancelar ----
    function fecharModalCancelar() {
      document.getElementById('modal-cancelar').classList.add('hidden');
      reservaParaCancelar = null;
    }

    function abrirModalCancelar(reserva) {
      reservaParaCancelar = reserva;
      document.getElementById('modal-cancelar').classList.remove('hidden');
    }

    document.getElementById('btn-confirmar-cancelar').addEventListener('click', async function() {
      if (!reservaParaCancelar) return;
      const btn = this;
      mostrarBtnLoading(btn);
      try {
        await apiPatch('reservas/' + reservaParaCancelar.id, { status: 'cancelado' });
        fecharModalCancelar();
        carregarReservas();
      } catch (err) {
        fecharModalCancelar();
        alert('Erro ao cancelar reserva. Tente novamente.');
      }
    });

    // ---- Modal Editar ----
    function fecharModalEditar() {
      document.getElementById('modal-editar').classList.add('hidden');
      reservaParaEditar = null;
      novoHorarioSelecionado = null;
    }

    function abrirModalEditar(reserva) {
      reservaParaEditar = reserva;
      novoHorarioSelecionado = null;
      document.getElementById('edit-horarios-grid').innerHTML = '<span style="color:var(--cor-texto-suave); font-size:0.85rem;">Selecione uma data primeiro</span>';
      document.getElementById('edit-horario-erro').textContent = '';
      document.getElementById('edit-alerta').classList.add('hidden');

      const hoje = new Date().toISOString().split('T')[0];
      const editData = document.getElementById('edit-data');
      editData.min = hoje;
      editData.value = reserva.data >= hoje ? reserva.data : hoje;

      document.getElementById('modal-editar').classList.remove('hidden');

      // Carregar horários para a data atual da reserva
      carregarHorariosEdicao();
    }

    document.getElementById('edit-data').addEventListener('change', carregarHorariosEdicao);

    function gerarSlotsBase() {
      const slots = [];
      for (let h = 7; h <= 18; h++) {
        slots.push((h < 10 ? '0' : '') + h + ':00');
      }
      return slots;
    }

    async function carregarHorariosEdicao() {
      if (!reservaParaEditar) return;
      const data = document.getElementById('edit-data').value;
      if (!data) return;

      const dataObj = new Date(data + 'T12:00:00');
      const diaSemana = dataObj.getDay();

      const grid = document.getElementById('edit-horarios-grid');

      if (diaSemana === 0) {
        grid.innerHTML = '<span style="color:var(--cor-texto-suave); font-size:0.85rem;">Não trabalhamos aos domingos.</span>';
        return;
      }

      grid.innerHTML = '<span class="loading-spinner dark" style="margin:8px;"></span>';
      novoHorarioSelecionado = null;

      try {
        const reservas = await apiGet('reservas?barbeiro_id=' + reservaParaEditar.barbeiro_id + '&data=' + data);
        // Excluir a própria reserva sendo editada dos ocupados
        const horariosOcupados = new Set(
          reservas.filter(function(r){ return r.status !== 'cancelado' && r.id !== reservaParaEditar.id; }).map(function(r){ return r.hora; })
        );

        const slots = gerarSlotsBase();
        const agora = new Date();
        const isHoje = data === agora.toISOString().split('T')[0];

        grid.innerHTML = '';
        slots.forEach(function(hora) {
          const [hh] = hora.split(':').map(Number);
          let disponivel = !horariosOcupados.has(hora);
          if (isHoje && hh <= agora.getHours()) disponivel = false;

          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'pill-opcao ' + (disponivel ? 'disponivel' : 'indisponivel');
          btn.textContent = hora;
          btn.disabled = !disponivel;
          if (disponivel) {
            btn.addEventListener('click', function() {
              document.querySelectorAll('#edit-horarios-grid .pill-opcao').forEach(function(b){ b.classList.remove('selecionado'); });
              btn.classList.add('selecionado');
              novoHorarioSelecionado = hora;
              document.getElementById('edit-horario-erro').textContent = '';
            });
          }
          grid.appendChild(btn);
        });
      } catch(err) {
        grid.innerHTML = '<span style="color:var(--cor-erro); font-size:0.85rem;">Erro ao carregar horários.</span>';
      }
    }

    document.getElementById('btn-confirmar-editar').addEventListener('click', async function() {
      document.getElementById('edit-horario-erro').textContent = '';
      const novaData = document.getElementById('edit-data').value;

      if (!novoHorarioSelecionado) {
        document.getElementById('edit-horario-erro').textContent = 'Selecione um horário';
        return;
      }

      const btn = this;
      mostrarBtnLoading(btn);

      try {
        const diasNomes = ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'];
        const dataObj = new Date(novaData + 'T12:00:00');
        const diaSemana = diasNomes[dataObj.getDay()];

        await apiPatch('reservas/' + reservaParaEditar.id, {
          data: novaData,
          diaSemana: diaSemana,
          hora: novoHorarioSelecionado
        });

        fecharModalEditar();
        carregarReservas();
      } catch(err) {
        document.getElementById('edit-alerta').innerHTML = '<div class="alert alert-error">Erro ao salvar. Tente novamente.</div>';
        document.getElementById('edit-alerta').classList.remove('hidden');
        esconderBtnLoading(btn);
      }
    });

    // ---- Renderizar card ----
    function renderizarCard(reserva) {
      const hoje = new Date().toISOString().split('T')[0];
      const passada = reserva.data < hoje;
      const cancelada = reserva.status === 'cancelado';
      const inicial = reserva.barbeiro_nome.charAt(0).toUpperCase();

      const badgeHtml = cancelada
        ? '<span class="badge badge-cancelado">Cancelado</span>'
        : passada
          ? '<span class="badge" style="background:#f5f5f5;color:#888;">Concluído</span>'
          : '<span class="badge badge-confirmado">Confirmado</span>';

      const tipoCorteNomes = { Maquina: 'Máquina', Tesoura: 'Tesoura', TesouraMaquina: 'Tesoura + Máquina' };
      const tipoLabel = reserva.tipoCorte ? ' (' + (tipoCorteNomes[reserva.tipoCorte] || reserva.tipoCorte) + ')' : '';
      const precoLabel = reserva.preco ? ' — R$ ' + Number(reserva.preco).toFixed(2).replace('.', ',') : '';

      const acoes = (!passada && !cancelada)
        ? '<button class="btn-editar" onclick=\'abrirModalEditar(' + JSON.stringify(reserva) + ')\'>✏️ Editar</button>' +
          '<button class="btn-danger" onclick=\'abrirModalCancelar(' + JSON.stringify(reserva) + ')\'>Cancelar</button>'
        : '';

      return '<div class="reserva-card">' +
        '<div class="reserva-card-header">' +
          '<span class="reserva-data">' + formatarData(reserva.data) + '</span>' +
          '<span class="reserva-dia">' + reserva.diaSemana + '</span>' +
          '<span class="reserva-hora">' + reserva.hora + '</span>' +
        '</div>' +
        '<div class="reserva-card-body">' +
          '<div class="reserva-avatar">' + inicial + '</div>' +
          '<div class="reserva-info">' +
            '<div class="reserva-servico">' + reserva.servico + tipoLabel + precoLabel + '</div>' +
            '<div class="reserva-barbeiro">' + reserva.barbeiro_nome + '</div>' +
          '</div>' +
          '<div class="reserva-acoes">' + badgeHtml + acoes + '</div>' +
        '</div>' +
      '</div>';
    }

    async function carregarReservas() {
      const container = document.getElementById('reservas-conteudo');
      container.innerHTML = '<div class="loading-container"><span class="loading-spinner dark"></span> Carregando reservas...</div>';

      try {
        const reservas = await apiGet('reservas?usuario_id=' + usuario.id);

        if (reservas.length === 0) {
          container.innerHTML =
            '<div class="estado-vazio">' +
              '<svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">' +
                '<rect x="3" y="4" width="18" height="18" rx="2"/>' +
                '<line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/>' +
                '<line x1="3" y1="10" x2="21" y2="10"/>' +
              '</svg>' +
              '<h3>Nenhuma reserva encontrada</h3>' +
              '<p>Você ainda não tem reservas agendadas.</p>' +
              '<a href="agendarhorario.html" class="btn-primary">Agendar agora →</a>' +
            '</div>';
          return;
        }

        const hoje = new Date().toISOString().split('T')[0];
        const futuras = reservas.filter(function(r) { return r.data >= hoje && r.status !== 'cancelado'; });
        const passadas = reservas.filter(function(r) { return r.data < hoje || r.status === 'cancelado'; });

        let html = '';

        if (futuras.length > 0) {
          html += '<div class="reservas-secao-titulo">Próximas Reservas</div><div class="reservas-lista">';
          futuras.sort(function(a, b) { return a.data.localeCompare(b.data); }).forEach(function(r) { html += renderizarCard(r); });
          html += '</div>';
        }

        if (passadas.length > 0) {
          html += '<div class="reservas-secao-titulo" style="margin-top:24px;">Reservas Anteriores</div><div class="reservas-lista">';
          passadas.sort(function(a, b) { return b.data.localeCompare(a.data); }).forEach(function(r) { html += renderizarCard(r); });
          html += '</div>';
        }

        container.innerHTML = html;

      } catch (err) {
        container.innerHTML = '<div class="alert alert-error">Erro ao carregar reservas. Tente novamente.</div>';
      }
    }

    carregarReservas();
  </script>

</body>
</html>
